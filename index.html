<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>古建筑屋面导排审计</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>古建筑屋面临时防雨层 · 导排审计</h1>
        <p class="subtitle">
          水每一步流向相邻且高程不高于当前格的最低格（并列去向全部审计）；
          外流、无去路、进入脆弱接缝、等高循环均为失效。所有计算仅在浏览器本地完成。
        </p>
      </header>

      <main class="layout">
        <section class="panel board-panel">
          <div class="toolbar">
            <label>行 <input id="rowsInput" type="number" min="1" max="40" value="5" /></label>
            <label>列 <input id="colsInput" type="number" min="1" max="40" value="5" /></label>
            <button id="newGridBtn" type="button">重建空网格</button>
            <span class="sep"></span>
            <div class="tools" role="group" aria-label="指针工具">
              <button type="button" class="tool active" data-tool="elevation">高程</button>
              <button type="button" class="tool" data-tool="drain">排水口</button>
              <button type="button" class="tool" data-tool="seam">脆弱接缝</button>
              <button type="button" class="tool" data-tool="normal">普通格</button>
            </div>
          </div>

          <div class="edit-bar" id="editBar">
            <span>未选中格：选择「高程」工具后点击格进行逐格高程编辑；其他工具可按住指针拖扫涂刷。</span>
          </div>

          <div id="grid" class="grid" aria-label="屋面网格图"></div>

          <div class="legend">
            <span><i class="sw normal"></i>普通格</span>
            <span><i class="sw drain"></i>排水口</span>
            <span><i class="sw seam"></i>脆弱接缝</span>
            <span><i class="sw selected"></i>当前选中</span>
            <span><i class="sw chain"></i>失效链</span>
          </div>
        </section>

        <aside class="panel side-panel">
          <button id="auditBtn" class="audit" type="button">发起审计</button>
          <div id="staleBanner" class="banner stale hidden">
            草稿自上次审计后已被修改，旧结论已失效；请重新发起审计。
          </div>
          <div id="status" class="status">尚未审计。标注高程、排水口与脆弱接缝后点击「发起审计」。</div>
          <div id="report" class="report"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 入口与清单不缓存，便于发布后即刻生效
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 健康检查端点（Docker HEALTHCHECK 与 Compose healthcheck 使用）
    location = /healthz {
        default_type text/plain;
        try_files $uri =404;
    }

    # 带内容指纹的静态资源可长缓存（正则含 } 需整体加引号）
    location ~* "\.[0-9a-f]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
